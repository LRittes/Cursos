set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# set -g default-terminal "screen-256color" set-option -sa terminal-overrides ",xterm-256color:RGB"
# set -g default-terminal "tmux-256color"
# set -g default-terminal "screen-256color"

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z 5

set -g mouse on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

set -g @thm_bg "#1e1e2e"
set -g @thm_fg "#cdd6f4"
set -g @thm_cyan "#89dceb"
set -g @thm_black "#181825"
set -g @thm_gray "#45475a" 
set -g @thm_magenta "#cba6f7"
set -g @thm_pink "#f5c2e7"
set -g @thm_red "#f38ba8" 
set -g @thm_green "#a6e3a1"
set -g @thm_yellow "#f9e2af"
set -g @thm_blue "#89b4fa" 
set -g @thm_orange "#fab387" 

gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-position top
set -g status-left-length 100
set -g status-justify left
set -g status-style "fg=#D8DEE9,bg=default"
set -g status-left "#[fg=#A3BE8C,bold] #S #[fg=#D8DEE9,bg=default,nobold] | "
set -g status-right "#[fg=#D8DEE9,bg=default]CPU: #{cpu} | RAM: #{mem} | DISK: #{disk}"
set -g status-left-style "fg=#D8DEE9,bg=default"
set -g status-right-style "fg=#D8DEE9,bg=default"
set-window-option -g window-status-style "fg=#D8DEE9,bg=default"
set-window-option -g window-status-current-style "fg=#88C0D0,bg=default"
set -g window-status-current-format "#[fg=#88C0D0,bg=default,bold]  #[fg=#88C0D0,bg=default,underscore]#I:#W#[nounderscore]"
set -g window-status-format "#[fg=#D8DEE9,bg=default] #I:#W"
set -g message-style "fg=#D8DEE9,bg=default"
set -g mode-style "fg=#3B2DEE,bg=#81A1C1"



set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
